[project]
name = "adas-capstone"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.12.13"
dependencies = [
    "alembic>=1.19.1",
    "apscheduler>=3.11.3",
    "argon2-cffi>=25.1.0",
    "fastapi[standard]>=0.136.1",
    "fpdf2>=2.8.8",
    "nvidia-ml-py>=13.590.20",
    "passlib[argon2]>=1.7.4",
    "psutil>=7.2.2",
    "pydantic-settings>=2.0",
    "pyjwt>=2.12.1",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.26",
    "requests>=2.33.1",
    "sqlmodel>=0.0.38",
]

[project.optional-dependencies]
ai = [
    "opencv-python>=4.13.0.92",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "ultralytics>=8.4.41",
]

# For teammates without an NVIDIA GPU. Identical to `ai` except that torch and
# torchvision come from PyTorch's CPU index instead of the CUDA 13 one — see
# [tool.uv.sources] below. Without this a GPU-less machine downloads a full
# CUDA build to run on the CPU.
#
# Pointing at the pytorch-cpu index rather than just omitting the CUDA index is
# deliberate: on Linux the DEFAULT PyPI torch wheel bundles the CUDA runtime,
# so plain PyPI would still pull the thing this extra exists to avoid. Windows
# happens to default to a CPU build, which makes the bug invisible on the
# machine this was developed on.
#
#     uv sync --extra ai-cpu
#
# Mutually exclusive with `ai` — see [tool.uv] conflicts.
ai-cpu = [
    "opencv-python>=4.13.0.92",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "ultralytics>=8.4.41",
]

# TensorRT is a SPEED optimization, not a requirement, and it is deliberately
# NOT part of the `ai` extra. The GPU is used either way — that comes from
# torch's CUDA build. TensorRT would add a faster inference backend on top.
#
# Nothing currently BUILDS an engine — export stays out of band — but capacity.py
# can now benchmark one that already exists, via `--model <path>.engine`. So this
# extra is what an engine measurement needs, and it is no longer inert.
#
# Whether it is worth installing is a separate question, and the answer on the
# GTX 1650 this was developed on is "probably not". Measured 2026-08-16 on the
# real model: FP16 runs at 1.00x FP32 (batch 15: 92.0ms vs 91.6ms), because the
# GTX 16-series has no tensor cores despite reporting compute capability 7.5.
# Batch 15 inside the 15 FPS tick needs ~1.75x on inference alone once the ~14ms
# of CPU-side to_gray() is subtracted, which is above what TensorRT delivers on
# Turing without tensor cores. 15 cameras at 10 FPS is the reachable claim.
# See docs/2026-08-11-calibration-capacity-design.md.
#
#     uv sync --extra ai --extra ai-trt
#
# WHY ALL FOUR tensorrt PACKAGES ARE DECLARED, and why they are pinned to
# NVIDIA's index: on PyPI, `tensorrt`, `tensorrt-cu13` and `tensorrt-cu13-libs`
# are wheel-stubs whose PEP 517 build downloads several GB from NVIDIA with no
# timeout. That build hung indefinitely twice on a Windows dev machine
# (2026-08-10). NVIDIA's own index ships `tensorrt-cu13-libs` — the package
# actually carrying those gigabytes — as a prebuilt wheel, so there is nothing
# left to hang on.
#
# Declaring all four is load-bearing, not belt-and-braces: [tool.uv.sources]
# binds only the project's OWN declared dependencies, so pinning `tensorrt`
# alone leaves the transitive -libs resolving from PyPI and reintroduces the
# exact hang. Verified 2026-08-16 by locking each variant in a scratch project.
#
# The markers are load-bearing too — TensorRT has no macOS build at all, so an
# unmarked dependency makes the lock unsolvable for a teammate on Apple silicon.
ai-trt = [
    # CAPPED BELOW 11, and the cap is the whole point — do not relax it to pick
    # up a newer TensorRT. `NetworkDefinitionCreationFlag.EXPLICIT_BATCH` was
    # deprecated in TensorRT 10 and REMOVED in 11, but ultralytics 8.4.41 still
    # calls it (utils/export/engine.py:151), so every engine export dies with
    #   AttributeError: ... has no attribute 'EXPLICIT_BATCH'
    # Observed 2026-08-16 with tensorrt 11.2.1.2, which is what an uncapped
    # `>=10.16.1.11` resolves to. 8.4.41 is the newest ultralytics available, so
    # there is no upgrade out of this yet; the cap comes off only once upstream
    # supports TRT 11.
    "tensorrt>=10.16.1.11,<11; sys_platform == 'win32' or sys_platform == 'linux'",
    "tensorrt-cu13>=10.16.1.11,<11; sys_platform == 'win32' or sys_platform == 'linux'",
    "tensorrt-cu13-bindings>=10.16.1.11,<11; sys_platform == 'win32' or sys_platform == 'linux'",
    "tensorrt-cu13-libs>=10.16.1.11,<11; sys_platform == 'win32' or sys_platform == 'linux'",
    # The .pt -> ONNX -> .engine chain Ultralytics runs during export. These were
    # previously absent from the lock entirely: Ultralytics pip-installs them
    # itself at export time via check_requirements(), which puts them outside
    # uv's view, so any `uv sync` could prune them and break the export with a
    # second, unrelated-looking error. Locked here instead.
    "onnx>=1.19.0",
    "onnxslim>=0.1.90",
    # Same story, and the reason this one matters: it supplies the CUDA and
    # TensorRT execution providers, so it is what runs an exported .onnx on the
    # GPU. Leaving it unlocked meant `uv sync` PRUNED it — caught by --dry-run
    # 2026-08-16 — silently removing the GPU ONNX path while appearing to
    # succeed. Markers as above: no macOS build.
    "onnxruntime-gpu>=1.28.0; sys_platform == 'win32' or sys_platform == 'linux'",
]

[dependency-groups]
dev = [
    "pypdf>=6.15.0",
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "pytest-xdist>=3.6",
    "ruff>=0.9",
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

# NVIDIA's own index. `explicit` so it is used ONLY for the packages pinned to
# it below — it must never become a general fallback for the rest of the tree.
[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[tool.uv]
# `ai` and `ai-cpu` both provide torch, from different indexes. uv cannot
# resolve a single lock entry for a package whose source depends on which
# extra is enabled unless the two are declared mutually exclusive.
conflicts = [[{ extra = "ai" }, { extra = "ai-cpu" }]]

[tool.uv.sources]
# Index selection is per-extra, so it must NOT be unconditional here — an
# unconditional cu130 pin would drag the CUDA wheels back into `ai-cpu`.
torch = [
    { index = "pytorch-cu130", extra = "ai" },
    { index = "pytorch-cpu", extra = "ai-cpu" },
]
torchvision = [
    { index = "pytorch-cu130", extra = "ai" },
    { index = "pytorch-cpu", extra = "ai-cpu" },
]
# Unqualified by extra, unlike the torch pins above: torch appears in both `ai`
# and `ai-cpu`, so its index must be selected per-extra. These four appear in
# `ai-trt` only, and an extra-qualified source additionally requires each named
# package to be declared in that extra — uv rejects the config otherwise.
tensorrt = { index = "nvidia" }
tensorrt-cu13 = { index = "nvidia" }
tensorrt-cu13-bindings = { index = "nvidia" }
tensorrt-cu13-libs = { index = "nvidia" }

[tool.pytest.ini_options]
testpaths = ["backend/tests", "ai_engine/tests"]
cache_dir = "backend/.pytest_cache"
# Two tiers are excluded from the default run; name either explicitly to opt in.
#   not slow  — backend/tests/perf/ (10_PKG_migration_evidence.md Step 3) seeds a
#               real 100,000-row database every session.
#   not clips — needs a GPU and ai_engine/eval/clips populated, so CI cannot run
#               them and most machines should not.
addopts = "-q -m 'not slow and not clips'"
markers = [
    "slow: marks tests as slow (excluded from the default run — see backend/tests/perf/)",
    "clips: needs a GPU and ai_engine/eval/clips populated; excluded from CI",
]

[tool.ruff]
line-length = 88
target-version = "py312"
# Ruff formats fenced ```python code blocks inside Markdown by default. This repo
# uses Ruff for Python only (Prettier owns Markdown), and several working docs at
# the repo root are untracked notes that must not be touched — so keep Ruff off
# Markdown entirely.
extend-exclude = [
    "ai_engine/snapshots",
    "ai_engine/sample_vids",
    ".venv",
    "*.md",
    # Frozen artifact staged from the research repo `adas_detection`. It is the
    # reference the ported detector is diffed against to prove the port changed
    # no behaviour (SPEC.md §8 step 3), so it must stay a faithful copy.
    # This covers the STAGED COPY under adas_transfer/ only. The port's own
    # working module, ai_engine/accumulate.py, is formatted and linted normally;
    # its equivalence to this reference is asserted behaviourally by
    # tests/test_accumulate.py, not by comparing source text.
    "ai_engine/adas_transfer",
]
# lint-staged passes explicit file paths, and Ruff ignores `extend-exclude` for
# paths given on the command line unless exclusions are forced. Without this the
# pre-commit hook would reformat the frozen package above regardless.
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # formatter owns line length

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query()/etc. in argument defaults is the framework's
# documented pattern, not the mutable-default bug B008 looks for.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]

[tool.ruff.lint.per-file-ignores]
# Scripts must call bootstrap_backend() before importing app.* — imports cannot be at top.
"backend/scripts/*.py" = ["E402"]

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # perf job only — too slow for every PR/push. Trigger manually from the
  # Actions tab (10_PKG_migration_evidence.md Step 7).
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12.13"
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: cp .env.example .env && uv run pytest -n auto --cov=backend/app --cov-report=term-missing

  # 10_PKG_migration_evidence.md Step 7 — catches a hand-edited migration
  # drifting from the models. Fresh checkout, empty database, real
  # `alembic upgrade head`, then diff the result against
  # SQLModel.metadata object-by-object (backend/scripts/verify_migration_schema.py).
  migration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12.13"
      - run: uv sync
      - run: cp .env.example .env
      - name: Apply the initial migration to a fresh empty database
        run: uv run alembic upgrade head
      - name: Assert the migrated schema matches SQLModel.metadata exactly
        run: uv run python backend/scripts/verify_migration_schema.py
      - name: Downgrade to base (proves downgrade() is complete and correct)
        run: uv run alembic downgrade base

  # workflow_dispatch only — seeds the real 100,000-row NFR-08 dataset and
  # times query/export/alert-delivery performance against it. Too slow for
  # every PR. Uploads the numbers as an artifact rather than gating on them
  # (be_plan/EVIDENCE.md already documents one known-slow case — 10k-row
  # PDF export — as a recorded finding, not a pass/fail).
  perf:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12.13"
      - run: uv sync
      - run: cp .env.example .env
      - run: uv run python backend/scripts/seed_dev_data.py --profile perf
      - name: Run the perf suite and capture timings
        run: uv run pytest -m slow backend/tests/perf/ -s -v | tee perf-results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: perf-results.txt
          retention-days: 30

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend lint
      - run: pnpm --filter frontend typecheck
      - run: pnpm --filter frontend test:run
      - run: pnpm --filter frontend build

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check:prettier

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12.13"
      - run: uv sync
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: cp .env.example .env
      - run: uv run python backend/scripts/reset_db.py
      - run: pnpm exec playwright test --project=chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Screenshot diff (FE_Implementation.md §6.5). Separate from `e2e` because it
  # is not a pass/fail gate on a legitimate design change — it is the reviewable
  # record of what a change did to every route.
  #
  # Baselines are generated HERE and nowhere else: font rasterisation on
  # ubuntu-latest and on Windows do not agree, so a locally generated PNG is
  # guaranteed to fail this job. When a phase legitimately changes a screen,
  # download the `visual-snapshots` artifact from this run and commit it.
  visual:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12.13"
      - run: uv sync
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: cp .env.example .env
      - run: uv run python backend/scripts/reset_db.py
      # `-u missing` is the mode that does both jobs: a route with no baseline
      # gets one written and passes (so a first capture produces all nine, not
      # just the first), while a route whose baseline CHANGED is left alone and
      # fails with an expected/actual/diff triple in the report — which is the
      # artefact Phase 2 depends on. Plain compare mode fails on missing
      # baselines too, and `-u all` would silently overwrite real diffs.
      - run: pnpm exec playwright test --project=visual -u missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-snapshots
          path: e2e/visual.spec.ts-snapshots/
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-report
          path: playwright-report/
          retention-days: 7

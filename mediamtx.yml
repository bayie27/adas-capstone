# Simulates the CDRRMO VMS by republishing sample clips as RTSP.
# Run from the repo root:  mediamtx mediamtx.yml
#
# Requires ai_engine/sample_vids/ to exist locally (gitignored — see README
# for how to obtain the clips). MediaMTX auto-creates any path on publish, so
# this file isn't strictly required, but runOnInit collapses the previous
# 5-terminal ffmpeg dance into a single `mediamtx mediamtx.yml`.
#
# -rtsp_transport tcp on publish is required, not cosmetic: with the default
# UDP transport, publishing all 5 channels at once over loopback drops RTP
# packets constantly ("RTP packets lost" / "invalid FU-A packet") — verified
# by running this file against real MediaMTX + ffmpeg. TCP publish is clean.
paths:
  channel1:
    runOnInit: ffmpeg -re -stream_loop -1 -i ./ai_engine/sample_vids/car_car.mp4 -c copy -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  channel2:
    runOnInit: ffmpeg -re -stream_loop -1 -i ./ai_engine/sample_vids/car-motor-motor.mp4 -c copy -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  channel3:
    runOnInit: ffmpeg -re -stream_loop -1 -i ./ai_engine/sample_vids/defour.mp4 -c copy -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  channel4:
    runOnInit: ffmpeg -re -stream_loop -1 -i ./ai_engine/sample_vids/red-car-motorcycle.mp4 -c copy -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  channel5:
    runOnInit: ffmpeg -re -stream_loop -1 -i ./ai_engine/sample_vids/motor-to-motor.mp4 -c copy -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes

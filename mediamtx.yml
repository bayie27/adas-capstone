# Simulates the CDRRMO VMS by republishing evaluation clips as RTSP.
# Run from the repo root:  mediamtx mediamtx.yml
#
# Requires ai_engine/eval/clips/ to be populated (gitignored — see
# ai_engine/eval/README.md). MediaMTX auto-creates any path on publish, so this
# file isn't strictly required, but runOnInit collapses the 5-terminal ffmpeg
# dance into a single command.
#
# Why these five: the first four are clips ai_engine/eval/baseline_epoch50.json
# records as DETECTED, so the engine alerts on each within a loop or two.
# channel5 is airbase.mp4, the crash-free negative — it must stay silent for the
# whole run. A camera that never alerts is as much a result as one that does.
#
# -rtsp_transport tcp on publish is required, not cosmetic: with the default UDP
# transport, publishing all 5 channels at once over loopback drops RTP packets
# constantly ("RTP packets lost" / "invalid FU-A packet") — verified by running
# this file against real MediaMTX + ffmpeg. TCP publish is clean.
#
# NOTE: MediaMTX writes auto.crt / auto.key into whatever directory it starts
# from, for its MoQ/WebRTC listeners. Both are gitignored — never commit the key.
# RTMP is unused by this project (AI engine and publishers are RTSP-only).
# Disabled because Windows can reserve TCP port ranges (Hyper-V/WSL dynamic
# port allocation) that happen to include 1935, causing a fatal bind failure
# that brings down every other MediaMTX listener along with it.
rtmp: no

# Ten 1440p readers overflow the default write queue, and MediaMTX then drops
# frames for whichever reader is behind. The AI engine decodes the gap as a
# broken H.264 reference chain: visible blocky corruption, and — because a
# corrupt frame can look like a collision — false alerts on the silent profile.
# Measured on this footage (74b66f6): 854 decoder errors in 40 seconds at the
# default, and 0 in 170 seconds at 8192, with no other change. airbase.mp4,
# which produces zero events in every offline evaluation, raised three accident
# alerts live at native resolution before this was set. Do not lower it while
# the engine reads full-resolution streams.
writeQueueSize: 8192

paths:
  channel1:
    runOnInit: ffmpeg -re -stream_loop -1 -i ./ai_engine/eval/clips/dekwatro.mp4 -c copy -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  channel2:
    runOnInit: ffmpeg -re -stream_loop -1 -i ./ai_engine/eval/clips/tric-motor-car.mp4 -c copy -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  channel3:
    runOnInit: ffmpeg -re -stream_loop -1 -i ./ai_engine/eval/clips/red-car-motor.mp4 -c copy -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  channel4:
    runOnInit: ffmpeg -re -stream_loop -1 -i ./ai_engine/eval/clips/motor-motor-night.mp4 -c copy -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  channel5:
    runOnInit: ffmpeg -re -stream_loop -1 -i ./ai_engine/eval/clips/airbase.mp4 -c copy -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  # channel6-10 extend the original five-camera fixture to ten. Ten is the
  # configuration writeQueueSize: 8192 above was measured against (74b66f6),
  # and the load the GPU decode path is characterised at, so the two belong
  # together — dropping back to five silently changes what the queue size is
  # sized for. channel5 stays the crash-free negative either way.
  channel6:
    runOnInit: ffmpeg -re -stream_loop -1 -i ./ai_engine/eval/clips/car-motor-motor.mp4 -c copy -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  channel7:
    runOnInit: ffmpeg -re -stream_loop -1 -i ./ai_engine/eval/clips/jeep-yellow-car.mp4 -c copy -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  channel8:
    runOnInit: ffmpeg -re -stream_loop -1 -i ./ai_engine/eval/clips/armored-car-car.mp4 -c copy -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  channel9:
    runOnInit: ffmpeg -re -stream_loop -1 -i ./ai_engine/eval/clips/jeep-car.mp4 -c copy -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
  channel10:
    runOnInit: ffmpeg -re -stream_loop -1 -i ./ai_engine/eval/clips/truck-student-car.mp4 -c copy -rtsp_transport tcp -f rtsp rtsp://localhost:$RTSP_PORT/$MTX_PATH
    runOnInitRestart: yes
